# ── Applicazione ─────────────────────────────────────────────
spring.application.name=demo
server.port=8080

# ── Database PostgreSQL ──────────────────────────────────────
# Prima di avviare, crea il database:  CREATE DATABASE archivio_documenti;
# Adatta nome DB, username e password alla tua installazione locale.
spring.datasource.url=jdbc:postgresql://localhost:5432/archivio_documenti
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ─────────────────────────────────────────
# update = Hibernate crea/aggiorna le tabelle a partire dalle entity (comodo in sviluppo).
# In produzione si usa 'validate' + migrazioni (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
# Log delle query SQL, formattate in modo leggibile
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Chiude la sessione JPA a fine service invece di tenerla aperta per tutta la richiesta web
spring.jpa.open-in-view=false

# ── Upload file ─────────────────────────────────────────────
# Limiti per il caricamento dei documenti (multipart/form-data)
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

# ── OCR (Tesseract) ─────────────────────────────────────────
# Cartella con i file *.traineddata (Tesseract installato via Homebrew)
ocr.tessdata-path=/opt/homebrew/share/tessdata
# Lingue usate dall'OCR: italiano e inglese insieme
ocr.language=ita+eng
